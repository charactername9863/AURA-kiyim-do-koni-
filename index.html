<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your AURA clothing account">
    <title>Sign In | AURA</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="Q5nOV4p6farNZHvOnm3dMn5iF7PcjStxCkYvagq5Dh0" />
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <a class="brand" href="store.html" aria-label="AURA home">AURA</a>
                <h1 id="login-title">Welcome back</h1>
                <p>Sign in to continue to your account.</p>
            </header>

            <form class="login-form" action="#" method="post">
                <div class="form-field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-field">
                    <div class="field-heading">
                        <label for="password">Password</label>
                        <a href="#forgot-password">Forgot password?</a>
                    </div>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="remember-me">
                    <span>Remember me</span>
                </label>

                <button class="login-button" type="submit">Sign in</button>
            </form>

            <div class="divider" aria-hidden="true">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <button class="social-button" type="button">Google</button>
                <button class="social-button" type="button">Apple</button>
            </div>

            <p class="signup-prompt">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
