<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your AURA clothing account">
    <title>Sign Up | AURA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="signup-title">
            <header class="login-header">
                <a class="brand" href="index.html" aria-label="AURA home">AURA</a>
                <h1 id="signup-title">Create your account</h1>
                <p>Join us and get started today.</p>
            </header>

            <form class="login-form" action="#" method="post">
                <div class="form-field">
                    <label for="full-name">Full name</label>
                    <input
                        id="full-name"
                        name="full-name"
                        type="text"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="email">Email address</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        id="confirm-password"
                        name="confirm-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Repeat your password"
                        minlength="8"
                        required
                    >
                </div>

                <label class="remember-me">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the terms and privacy policy.</span>
                </label>

                <button class="login-button" type="submit">Create account</button>
            </form>

            <p class="signup-prompt">
                Already have an account?
                <a href="index.html">Sign in</a>
            </p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
